# 배정플립 자동 릴리스
# main 에 소스·설치 파일 변경이 올라오면, 소스에 적힌 버전의 릴리스를 확인해서
#  - 릴리스가 없으면: Windows 에서 빌드 → 공개용 zip 과 설치 파일(Setup.exe) → v<버전> 태그와 릴리스 생성
#  - 릴리스는 있는데 설치 파일이 없으면: 설치 파일만 만들어 그 릴리스에 첨부
#  - 둘 다 있으면: 아무것도 하지 않음
# 새 버전을 내려면 src/BaejeongFlip.cs 의 AssemblyInformationalVersion 과 Settings.Version 을 함께 올리세요.
# 인증키는 넣지 않습니다 (공개용). 학교용은 build.sh setup 으로 따로 만듭니다.
name: 릴리스

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "installer/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: 버전과 릴리스 상태 확인
        id: ver
        run: |
          V=$(sed -n 's/.*AssemblyInformationalVersion("\([^"]*\)").*/\1/p' src/BaejeongFlip.cs)
          C=$(sed -n 's/.*Version = "\([^"]*\)".*/\1/p' src/BaejeongFlip.cs | head -1)
          if [ -z "$V" ] || [ "$V" != "$C" ]; then
            echo "::error::버전이 서로 다릅니다: AssemblyInformationalVersion=$V, Settings.Version=$C"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            if gh release view "v$V" --json assets --jq '.assets[].name' > assets.txt && grep -qx "BaejeongFlip-$V-Setup.exe" assets.txt && grep -qx "SHA256SUMS.txt" assets.txt; then
              echo "need_setup=false" >> "$GITHUB_OUTPUT"
              echo "v$V 릴리스에 zip·설치 파일·해시 파일이 모두 있어서 건너뜁니다."
            else
              echo "need_setup=true" >> "$GITHUB_OUTPUT"
              echo "v$V 릴리스에 설치 파일 또는 해시 파일이 없어서 만들어 첨부합니다."
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "need_setup=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 빌드 (.NET Framework 4 컴파일러)
        if: steps.ver.outputs.need_setup == 'true'
        shell: cmd
        run: |
          if not exist release mkdir release
          "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /platform:anycpu /codepage:65001 /r:System.Web.Extensions.dll /r:System.Security.dll /out:release\BaejeongFlip.scr src\*.cs

      - name: 설치 zip 만들기 (인증키 없음)
        if: steps.ver.outputs.exists == 'false'
        run: |
          python - "${{ steps.ver.outputs.version }}" <<'PY'
          import sys, zipfile
          ver = sys.argv[1]
          files = [("release/BaejeongFlip.scr", "BaejeongFlip.scr"),
                   ("installer/설치하기.bat", "설치하기.bat"),
                   ("installer/제거하기.bat", "제거하기.bat"),
                   ("installer/설치방법.txt", "설치방법.txt")]
          with zipfile.ZipFile(f"release/BaejeongFlip-{ver}.zip", "w", zipfile.ZIP_DEFLATED) as z:
              for src, name in files:
                  z.write(src, name)
          PY

      - name: 설치 파일 만들기 (NSIS, 인증키 없음)
        if: steps.ver.outputs.need_setup == 'true'
        shell: cmd
        run: |
          set "MAKENSIS=%ProgramFiles(x86)%\NSIS\makensis.exe"
          if not exist "%MAKENSIS%" choco install nsis -y --no-progress
          if not exist "%MAKENSIS%" set "MAKENSIS=%ProgramFiles%\NSIS\makensis.exe"
          "%MAKENSIS%" /V2 /DVERSION=${{ steps.ver.outputs.version }} "/DSCR=%CD%\release\BaejeongFlip.scr" "/DOUTFILE=%CD%\release\BaejeongFlip-${{ steps.ver.outputs.version }}-Setup.exe" installer\setup.nsi

      - name: 확인용 해시 파일 만들기 (앱의 [업데이트] 버튼이 받은 파일을 검증할 때 사용)
        if: steps.ver.outputs.need_setup == 'true'
        run: |
          cd release
          sha256sum "BaejeongFlip-${{ steps.ver.outputs.version }}-Setup.exe" > SHA256SUMS.txt
          if [ -f "BaejeongFlip-${{ steps.ver.outputs.version }}.zip" ]; then sha256sum "BaejeongFlip-${{ steps.ver.outputs.version }}.zip" >> SHA256SUMS.txt; fi
          cat SHA256SUMS.txt

      - name: 태그와 릴리스 만들기
        if: steps.ver.outputs.exists == 'false'
        run: |
          V="${{ steps.ver.outputs.version }}"
          cat > notes.md <<NOTES
          ## 설치
          - **설치 파일:** \`BaejeongFlip-$V-Setup.exe\`를 실행하고 대기 시간을 고르면 끝납니다. Windows "설정 → 앱"에서 제거할 수 있습니다.
          - **zip:** \`BaejeongFlip-$V.zip\`의 압축을 풀고 \`설치하기.bat\`를 실행합니다.

          NEIS·기상청 인증키는 들어 있지 않습니다. 설정 창에 넣거나, 설치 폴더에 \`neis-key.txt\`·\`kma-key.txt\`를 함께 두고 설치하세요.
          NOTES
          gh release create "v$V" "release/BaejeongFlip-$V.zip" "release/BaejeongFlip-$V-Setup.exe" release/SHA256SUMS.txt \
            --target "${{ github.sha }}" \
            --title "배정플립 $V" \
            --notes-file notes.md \
            --generate-notes

      - name: 기존 릴리스에 설치 파일 첨부
        if: steps.ver.outputs.exists == 'true' && steps.ver.outputs.need_setup == 'true'
        run: |
          V="${{ steps.ver.outputs.version }}"
          gh release upload "v$V" "release/BaejeongFlip-$V-Setup.exe" release/SHA256SUMS.txt --clobber
